name: PHPUnit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  main:
    name: Build and test

    strategy:
      fail-fast: false
      matrix:
        # Local development runs 8.2; Vercel (vercel-php 0.7.x) runs 8.3.
        php-versions: ['8.2', '8.3']

    runs-on: ubuntu-24.04
    if: (! contains(github.event.pull_request.title, '[ci skip]'))

    # The app's migrations are MySQL-specific, so database tests use a real MySQL.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: glc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer, pecl, phpunit
          extensions: intl, json, mbstring, mysqli, mysqlnd, xdebug, xml, sqlite3, zip
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction
        # To prevent rate limiting you may need to supply an OAuth token in Settings > Secrets
        # env:
          # https://getcomposer.org/doc/articles/troubleshooting.md#api-rate-limit-and-oauth-tokens
          # COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Test with phpunit
        run: vendor/bin/phpunit --coverage-text
        env:
          database_tests_hostname: 127.0.0.1
          database_tests_port: 3306
          database_tests_database: glc_test
          database_tests_username: root
          database_tests_password: root
          database_tests_DBDriver: MySQLi
          database_tests_DBPrefix: ''
          database_tests_charset: utf8mb4
